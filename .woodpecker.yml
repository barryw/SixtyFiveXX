when:
  - event: [push, pull_request, manual]

steps:
  - name: build-and-test
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - dotnet build -c Release
      - dotnet test tests/SixtyFiveXX.Tests -c Release --filter "Category!=Performance"

  - name: conformance
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - apt-get update && apt-get install -y --no-install-recommends 64tass
      - tests/SixtyFiveXX.Conformance/klaus/build.sh
      - dotnet test tests/SixtyFiveXX.Conformance -c Release

  - name: performance
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - dotnet test tests/SixtyFiveXX.Tests -c Release --filter "Category=Performance" -v n
